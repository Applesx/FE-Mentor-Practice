<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Result Summary Component</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="result-card">
      <div class="left">
        <h2>Your Result</h2>
        <div class="score-circle">
          <span class="score">76</span>
          <span class="out-of">of 100</span>
        </div>
        <h3>Great</h3>
        <p>You scored higher than 65% of the people who have taken these tests.</p>
      </div>
      <div class="right">
        <h2>Summary</h2>
        <div class="summary-item reaction">
          <span class="label">⚡ Reaction</span>
          <span class="value"><strong>80</strong> / 100</span>
        </div>
        <div class="summary-item memory">
          <span class="label">🧠 Memory</span>
          <span class="value"><strong>92</strong> / 100</span>
        </div>
        <div class="summary-item verbal">
          <span class="label">💬 Verbal</span>
          <span class="value"><strong>61</strong> / 100</span>
        </div>
        <div class="summary-item visual">
          <span class="label">👁️ Visual</span>
          <span class="value"><strong>73</strong> / 100</span>
        </div>
        <button class="continue-btn">Continue</button>
      </div>
    </div>
  </div>
</body>
</html>
